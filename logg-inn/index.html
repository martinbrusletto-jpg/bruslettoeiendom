<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logg inn · Brusletto Eiendom</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#F3F1EC;--paper:#FBFAF7;--ink:#171C20;--ink-2:#4F555A;--ink-3:#8A8D90;--line:#D6D1C8;--cu:#B0703F;--cu-ink:#8C5329;--slate:#1D2327;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Geist","Helvetica Neue",Arial,sans-serif;font-size:18px;padding:32px 16px;-webkit-font-smoothing:antialiased}
form{width:min(420px,100%);display:flex;flex-direction:column;gap:22px}
svg{height:56px;width:auto;align-self:flex-start}
.e{font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cu-ink)}
h1{margin:0;font-weight:500;font-size:32px;letter-spacing:-.035em;line-height:1.1}
label{display:flex;flex-direction:column;gap:8px;font-size:16px;color:var(--ink-2)}
input{font:inherit;font-size:20px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:56px}
input:focus{outline:3px solid rgba(176,112,63,.35);border-color:var(--cu)}
button{font:inherit;font-size:19px;font-weight:500;background:var(--slate);color:var(--paper);border:0;border-radius:12px;padding:16px 24px;min-height:58px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.feil{color:#9A3B2E;font-size:17px;margin:0;min-height:1.4em}
a{color:var(--ink-2);font-size:16px}
.vis{font-size:15px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-direction:row}
.vis input{min-height:auto;width:20px;height:20px}
</style>
</head>
<body>
<form id="skjema" novalidate>
  <svg viewBox="0 0 12.75 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M6.75 0V6.25"/><path d="M6.75 8.75V16"/><path d="M4.75 7.5H11.25"/><path d="M5.5 1H4.75A3.25 3.25 0 0 0 4.75 7.5"/><path d="M5.5 15H4.75A3.75 3.75 0 0 1 4.75 7.5"/><path d="M8 1H12.25"/><path d="M8 15H12.75"/></g></svg>
  <span class="e">Brusletto Eiendom</span>
  <h1>Logg inn</h1>
  <label for="epost">E-post<input id="epost" name="epost" type="email" autocomplete="username" required></label>
  <label for="passord">Passord<input id="passord" name="passord" type="password" autocomplete="current-password" required></label>
  <label class="vis" for="vis"><input id="vis" type="checkbox"> Vis passordet</label>
  <p class="feil" id="feil" role="alert"></p>
  <button type="submit" id="knapp">Logg inn</button>
  <a href="/">Til forsiden</a>
</form>
<script>
const f = document.getElementById('skjema'), feil = document.getElementById('feil'), knapp = document.getElementById('knapp');
document.getElementById('vis').addEventListener('change', e => { document.getElementById('passord').type = e.target.checked ? 'text' : 'password'; });
f.addEventListener('submit', async e => {
  e.preventDefault();
  feil.textContent = ''; knapp.disabled = true; knapp.textContent = 'Logger inn …';
  try {
    const r = await fetch('/api/logg-inn', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ epost: f.epost.value, passord: f.passord.value }) });
    if (r.ok) {
      const til = new URLSearchParams(location.search).get('til');
      location.href = til && til.startsWith('/') && !til.startsWith('//') ? til : '/plattform/';
      return;
    }
    feil.textContent = (await r.json().catch(() => ({}))).feil || 'Noe gikk galt. Prøv igjen.';
  } catch { feil.textContent = 'Fikk ikke kontakt. Sjekk nettet og prøv igjen.'; }
  knapp.disabled = false; knapp.textContent = 'Logg inn';
});
</script>
</body>
</html>
