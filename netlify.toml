[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/scrollfilm.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/journal/*"
  to = "/"
  status = 301

# Én adresse for søkemotorene: netlify.app-adressen sendes til domenet
[[redirects]]
  from = "https://bruslettoeiendom.netlify.app/*"
  to = "https://bruslettoeiendom.no/:splat"
  status = 301
  force = true

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Gamle adresser fra forrige nettsted på domenet
[[redirects]]
  from = "/page-sitemap.xml"
  to = "/sitemap.xml"
  status = 301

[[redirects]]
  from = "/wp-*"
  to = "/"
  status = 301

# Prosjektsidene under eget domene
[[redirects]]
  from = "/heyerdahlsvei8/*"
  to = "https://heyerdahls-vei-8b.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/heyerdahls-vei-8b/*"
  to = "/heyerdahlsvei8/:splat"
  status = 301
  force = true

# Varden 8: registrering til kjøperportalen går fortsatt til Varden 8-nettstedet
[[redirects]]
  from = "/varden8/api/quick-register"
  to = "https://varden8.netlify.app/.netlify/functions/quick-register"
  status = 200
  force = true
