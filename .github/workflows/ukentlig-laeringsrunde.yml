name: Ukentlig AI OS-kontroll

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kontroller AI OS-struktur
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "AI_OS.md"
            "ABOUT_MARTIN.md"
            "CORRECTIONS.md"
            "CLAUDE.md"
            "AGENTS.md"
            "references/EMAIL_SMS_EXAMPLES.md"
            "references/ETAKST_PROPERTY_EXAMPLES.md"
            "references/NEGATIVE_PATTERNS.md"
            "references/REAL_ESTATE_METHOD.md"
            "references/NEGOTIATION_AND_SALES.md"
            "references/ANALYSIS_STYLE.md"
            "references/WEBSITE_DESIGN_SYSTEM.md"
            "references/DECISION_PATTERNS.md"
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Mangler $file"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          grep -q 'AI_OS.md' CLAUDE.md || {
            echo "::error::CLAUDE.md peker ikke til AI_OS.md"
            exit 1
          }

          grep -q 'AI_OS.md' AGENTS.md || {
            echo "::error::AGENTS.md peker ikke til AI_OS.md"
            exit 1
          }

          echo "AI OS-strukturen er intakt."

      - name: Vis ukens endringer
        shell: bash
        run: |
          echo "## Endringer siste 8 dager" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          git log --since="8 days ago" --stat --oneline >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Oppsummer læringsloggen
        shell: bash
        run: |
          observations=$(grep -Eic 'Status:\*\* observasjon|Status: observasjon' CORRECTIONS.md || true)
          repeated=$(grep -Eic 'Status:\*\* gjentatt mønster|Status: gjentatt mønster' CORRECTIONS.md || true)
          permanent=$(grep -Eic 'Status:\*\* varig regel|Status: varig regel' CORRECTIONS.md || true)

          {
            echo "## Læringsstatus"
            echo "- Observasjoner: $observations"
            echo "- Gjentatte mønstre: $repeated"
            echo "- Varige regler: $permanent"
            echo ""
            echo "Selve læringen og oppdateringen av filene håndteres av Martins separate ukentlige AI-læringsloop. Denne workflowen gjør kun struktur- og integritetskontroll og krever ingen API-nøkkel."
          } >> "$GITHUB_STEP_SUMMARY"
